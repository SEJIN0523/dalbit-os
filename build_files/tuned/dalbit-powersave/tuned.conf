# Dalbit OS 강력 절전 모드
# KDE 배터리 아이콘에서 전원 프로필을 "절전"으로 선택하면 적용됩니다.
# 다른 프로필로 바꾸면 tuned가 아래 값을 모두 원래대로 되돌립니다.

[main]
summary=Dalbit OS - 최대 배터리 절약 (성능 제한)
include=powersave

[cpu]
# CPU를 최대 절전 정책으로
energy_performance_preference=power

[sysfs]
# CPU 부스트(순간 최고 클럭) 끄기
/sys/devices/system/cpu/cpufreq/boost=0
/sys/devices/system/cpu/cpufreq/policy*/boost=0
# 내장 GPU(760M) 저전력 고정 (동영상 디코딩은 별도 VCN 엔진이라 영향 적음)
/sys/class/drm/card*/device/power_dpm_force_performance_level=low
