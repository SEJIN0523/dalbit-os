name: Build Dalbit ISO

# 설치 USB용 ISO는 필요할 때만 수동으로 빌드합니다 (Actions 탭 → Build Dalbit ISO → Run workflow)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'disk_config/**'
      - '.github/workflows/build-iso.yml'

env:
  IMAGE: ghcr.io/sejin0523/dalbit:latest
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: 디스크 공간 확보
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: 준비
        run: echo "OWNER=$(id -u):$(id -g)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: ISO 빌드
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE }}
          chown: ${{ env.OWNER }}
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs btrfs

      - name: 체크섬 생성
        run: |
          cd "${{ steps.build.outputs.output-directory }}"
          find . -name '*.iso' -exec sha256sum {} \; | tee SHA256SUMS
          ls -lh $(find . -name '*.iso')

      - name: ISO 업로드 (Actions 아티팩트)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dalbit-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
