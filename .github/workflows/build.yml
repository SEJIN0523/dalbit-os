name: Build Dalbit OS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'   # 매일 한국시간 새벽 4시 (기반 이미지 업데이트 반영)
  workflow_dispatch:

env:
  IMAGE_NAME: dalbit
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # PR 빌드는 테스트만 하고, main 브랜치일 때만 업로드/서명
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      # 외부 액션은 커밋 SHA로 고정 (태그 바꿔치기 공격 방지)
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 디스크 공간 확보
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: 준비
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "DATE_TAG=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: 이미지 빌드
        run: |
          podman build --pull=newer --tag "${IMAGE_NAME}:latest" .

      # 이미지를 최대 127개 조각으로 다시 나눠, PC가 업데이트할 때 바뀐 조각만 받도록 함
      # (ublue-os/image-template의 ostree-rechunk 방식)
      - name: 업데이트 분할 (rechunk)
        run: |
          set -euxo pipefail
          GRAPHROOT="$(podman info --format '{{.Store.GraphRoot}}')"
          podman run --rm --pull=never --privileged \
            --mount=type=image,src="${IMAGE_NAME}:latest",target=/rpm-ostree \
            --mount=type=bind,src="${GRAPHROOT}",target=/run/host-container-storage,rw \
            --mount=type=tmpfs,target=/run/rpm-ostree-storage \
            --entrypoint /usr/bin/rpm-ostree \
            "localhost/${IMAGE_NAME}:latest" \
            compose build-chunked-oci \
            --max-layers 127 \
            --format-version=2 \
            --bootc \
            --rootfs /rpm-ostree \
            --output "containers-storage:[overlay@/run/host-container-storage+/run/rpm-ostree-storage]localhost/${IMAGE_NAME}:latest"
          podman tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${DATE_TAG}" "${IMAGE_NAME}:${SHORT_SHA}"
          echo "레이어 수: $(podman inspect --format '{{len .RootFS.Layers}}' "${IMAGE_NAME}:latest")"

      - name: 이미지 검사
        run: |
          podman run --rm "${IMAGE_NAME}:latest" bash -euxc '
            test -x /usr/bin/dalbit-check
            systemctl is-enabled dalbit-battery-init.service
            test -x /usr/bin/dalbit-battery
            bash -n /usr/bin/dalbit-battery
            bash -n /usr/bin/dalbit-check
            grep -q "zram-size = ram" /etc/systemd/zram-generator.conf
            grep -q "vm.swappiness = 180" /usr/lib/sysctl.d/99-dalbit.conf
            jq -e ".transports.docker[\"ghcr.io/sejin0523/dalbit\"]" /etc/containers/policy.json
            rpm -q fcitx5-hangul libva-utils tuned-ppd
            if rpm -q firefox; then exit 1; fi
            grep -q "InputMethod=/usr/share/applications/org.fcitx.Fcitx5.desktop" /etc/xdg/kwinrc
            grep -q "korean:ralt_hangul" /etc/xdg/kxkbrc
            grep -q "DefaultIM=hangul" /etc/xdg/fcitx5/profile
            grep -q "XMODIFIERS=@im=fcitx" /usr/lib/environment.d/90-dalbit-ime.conf
            grep -q "^NAME=\"Dalbit OS\"" /usr/lib/os-release
            grep -q "^ID=fedora" /usr/lib/os-release
            test -f /usr/share/icons/hicolor/scalable/apps/dalbit.svg
            test -f /usr/share/wallpapers/Dalbit/contents/images/3840x2160.svg
            test -f /usr/share/wallpapers/Dalbit/contents/images_dark/3840x2160.svg
            test -f /usr/share/color-schemes/DalbitLight.colors
            test -f /usr/share/plasma/look-and-feel/org.dalbit.light.desktop/contents/defaults
            test -f /usr/share/icons/dalbit-dark/places/scalable/folder-download.svg
            test -f /usr/share/icons/dalbit-light/places/scalable/folder-download.svg
            grep -q "Theme=dalbit-dark" /etc/xdg/kdeglobals
            test -f /usr/share/icons/dalbit-dark/apps/scalable/start-here-kde-fedora.svg
            test -f /usr/share/icons/dalbit-light/apps/scalable/dalbit.svg
            test -f /usr/share/plasma/look-and-feel/org.dalbit.desktop/contents/layouts/org.kde.plasma.desktop-layout.js
            test -f /usr/share/plasma/look-and-feel/org.dalbit.light.desktop/contents/layouts/org.kde.plasma.desktop-layout.js
            test -f /usr/share/fcitx5/themes/dalbit-dark/theme.conf
            test -f /usr/share/fcitx5/themes/dalbit-light/theme.conf
            grep -q "DarkTheme=dalbit-dark" /etc/xdg/fcitx5/conf/classicui.conf
            grep -q "^VERSION_ID=44" /usr/lib/os-release
            test -f /etc/xdg/autostart/dalbit-setup.desktop
            bash -n /usr/bin/dalbit-setup
            test -x /usr/libexec/dalbit/update-notify
            bash -n /usr/libexec/dalbit/update-notify
            systemctl --global is-enabled dalbit-update-notify.timer
            test -f /usr/share/konsole/Dalbit.profile
            test -f /usr/share/konsole/DalbitDark.colorscheme
            grep -q "DefaultProfile=Dalbit.profile" /etc/xdg/konsolerc
            rpm -q kde-connect
            firewall-offline-cmd --list-services | grep -q kdeconnect
            for f in cc-status cc-power battery-set welcome-once; do test -x /usr/libexec/dalbit/$f; bash -n /usr/libexec/dalbit/$f; done
            bash -n /usr/bin/dalbit-battery
            test -f /usr/share/polkit-1/actions/org.dalbit.battery.policy
            test -f /usr/share/plasma/plasmoids/org.dalbit.controlcenter/contents/ui/main.qml
            test -f /usr/share/plasma/plasmoids/org.dalbit.welcome/contents/ui/main.qml
            test -f /etc/xdg/autostart/dalbit-welcome.desktop
            test -f /usr/share/icons/dalbit-dark/apps/scalable/com.google.Chrome.svg
            grep -q "org.dalbit.controlcenter" /usr/share/plasma/look-and-feel/org.dalbit.desktop/contents/layouts/org.kde.plasma.desktop-layout.js

            grep -q "images_dark/3840x2160.svg" /etc/xdg/kscreenlockerrc
            grep -q dalbit-logo /etc/xdg/kcm-about-distrorc
            fastfetch --pipe --logo none -s OS | grep -q "Dalbit OS"
            grep -q "LookAndFeelPackage=org.dalbit.desktop" /etc/xdg/kdeglobals
            test -f /usr/share/color-schemes/DalbitDark.colors
            test -x /usr/bin/dalbit-theme
            grep -q "Dalbit/contents/images_dark/3840x2160.svg" /usr/lib/plasmalogin/defaults.conf
            plymouth-set-default-theme | grep -qx dalbit
            test -f /usr/share/plymouth/themes/dalbit/crescent.png
            test -f /usr/share/plymouth/themes/dalbit/star.png
            fc-list : family > /tmp/fc.txt
            grep -q Pretendard /tmp/fc.txt
            grep -q D2Coding /tmp/fc.txt
            fc-match sans-serif | grep -q Pretendard
            fc-match monospace | grep -q D2Coding
            grep -q "font=Pretendard" /etc/xdg/kdeglobals
            grep -q "M124.06 28.08" /usr/share/pixmaps/dalbit-logo.svg
            if grep -q "<mask" /usr/share/pixmaps/dalbit-logo.svg /usr/share/wallpapers/Dalbit/contents/*/3840x2160.svg /usr/share/icons/dalbit-*/places/scalable/*.svg; then exit 1; fi
            lsinitrd /usr/lib/modules/*/initramfs.img | grep -q "plymouth/themes/dalbit/dalbit.script"
            if rpm -q librsvg2-tools; then exit 1; fi
            systemctl is-enabled dalbit-grub-hide-menu.service
            bash -n /usr/libexec/dalbit/grub-hide-menu
            bash -n /usr/bin/dalbit-theme
            grep -q "x-scheme-handler/https=com.google.Chrome.desktop" /etc/xdg/mimeapps.list
            grep -q "^power-saver=dalbit-powersave$" /etc/tuned/ppd.conf
            ls /usr/lib/tuned/profiles/dalbit-powersave/tuned.conf /usr/lib/tuned/dalbit-powersave/tuned.conf 2>/dev/null | grep -q .
          '


      # 위젯(QML) 문법 검사: 검사용 컨테이너에만 Qt 도구를 잠깐 설치 (이미지에는 들어가지 않음)
      - name: 위젯 문법 검사
        run: |
          podman run --rm "${IMAGE_NAME}:latest" bash -euxc '
            dnf5 install -y --setopt=install_weak_deps=False qt6-qtdeclarative-devel > /dev/null
            QMLFORMAT=$(command -v qmlformat || ls /usr/lib64/qt6/bin/qmlformat)
            for f in /usr/share/plasma/plasmoids/org.dalbit.*/contents/ui/*.qml; do
              "$QMLFORMAT" "$f" > /dev/null
            done
            for f in /usr/share/plasma/plasmoids/org.dalbit.*/metadata.json; do jq -e .KPlugin.Id "$f" > /dev/null; done
            xmllint --noout /usr/share/polkit-1/actions/org.dalbit.battery.policy 2>/dev/null || python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse(sys.argv[1])" /usr/share/polkit-1/actions/org.dalbit.battery.policy
          '

      - name: GHCR 로그인
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 업로드
        id: push
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          for tag in latest "${DATE_TAG}" "${SHORT_SHA}"; do
            podman push --digestfile=/tmp/digestfile \
              "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      - name: Cosign 설치
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: 이미지 서명
        if: env.PUBLISH == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # PC(rpm-ostree/bootc)가 읽을 수 있는 구형 서명 형식 사용
          # https://github.com/containers/container-libs/issues/388
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: 서명 검증
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify --key cosign.pub \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" > /dev/null
          echo "✅ 서명 검증 완료"
